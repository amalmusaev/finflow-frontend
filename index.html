<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=finflow" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=finflow" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=finflow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finflow</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('finflow_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
