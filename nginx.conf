server {
    listen 80;
    server_name localhost;
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Раздача фронтенда (SPA роутинг)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на контейнер бэкенда по его имени
    location /api/ {
        proxy_pass http://finflow-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование документации
    location ~ ^/(docs|redoc|openapi.json|health) {
        proxy_pass http://finflow-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
